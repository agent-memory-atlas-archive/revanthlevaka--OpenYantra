name: OpenYantra CI

on:
  push:
    branches: [ main, "feat/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: python -m pip install ruff

      - name: Blocking checks (syntax errors, undefined names)
        run: ruff check . --select E9,F63,F7,F82

      - name: Full style report (informational)
        continue-on-error: true
        run: ruff check . --output-format=github

  test:
    name: Test (${{ matrix.os }} - Py ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]
        include:
          - os: macos-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.11"

    env:
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Upgrade core packaging tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install dependencies
        run: |
          pip install -e ".[full,dev]"

      - name: Verify Python byte-compilation (Syntax Integrity)
        run: |
          python -m compileall openyantra

      - name: Run Pytest Suite
        run: |
          pytest -v

  package-build:
    name: Build & Validate Distribution Packages
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install build & validation tools
        run: |
          python -m pip install --upgrade pip build twine

      - name: Build wheel and sdist
        run: |
          python -m build

      - name: Check distribution metadata with Twine
        run: |
          twine check dist/*
